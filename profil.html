<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Facility</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="header"> 
        <a href="index.html" class="header-logo">
            <span class="header-logo-dice">🎲</span>
            <div class="header-logo-text">
                <span class="header-logo-name">MJ Facility</span>
            </div>
        </a>

        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Lance tes dés</a></li>
                <li><a href="profil.html" class="nav-link">Profil</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <div class="profil-container">

                <div class="entete">
                    <h1 class="titre">MJ Facility</h1>
                    <div class="logo">🐺</div>
                    <p class="sous-titre">Connecte-toi</p>
                </div>

                <form id="loginForm">
                    <label for="username">Nom d'utilisateur:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="password">Mot de passe:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit">Se connecter</button>
                </form>
                <p>Pas encore de compte ? <a href="minscrire.html">M'inscrire</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MJ Facility. Tous droits réservés.</p>
    </footer>
</body>
</html>
