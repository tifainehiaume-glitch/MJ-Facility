<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Facility</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header> 
        <h1>MJ Facility</h1>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Lance tes dés</a></li>
                <li><a href="profil.html">Mon profil</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="container">
            <h2>Mon profil</h2>
            <div class="connexion">
                <h3>Me connecter</h3>
                <form id="loginForm">
                    <label for="username">Nom d'utilisateur:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="password">Mot de passe:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit">Se connecter</button>
                </form>
                <p>Pas encore de compte ? <a href="minscrire.html">M'inscrire</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MJ Facility. Tous droits réservés.</p>
    </footer>
</body>
</html>
