<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Facility</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="header"> 
        <a href="index.html" class="header-logo">
            <span class="header-logo-dice">🎲</span>
            <div class="header-logo-text">
                <span class="header-logo-name">MJ Facility</span>
            </div>
        </a>

        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Lance tes dés</a></li>
                <li><a href="profil.html" class="nav-link">Profil</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <div class="profil-container">

                <div class="entete">
                    <h1 class="titre">MJ Facility</h1>
                    <div class="logo">🐺</div>
                    <p class="sous-titre">Connecte-toi</p>
                </div>

                <div class="bannerError" id="bannerError">
                    <p>Email ou mot de passe incorrect.</p>
                </div>

                <form id="loginForm" onsubmit="soumettreLogin(event)"> 

                    <div class="champ">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="ton@email.com" required>
                        <span id="emailError" class="error" >Adresse e-mail invalide.</span>
                    </div>

                    <div class="champ">
                        <label for="password">Mot de passe:</label>
                        <input type="password" id="password" name="password" placeholder="mot de passe" required>
                        <span id="passwordError" class="error">Le mot de passe est incorrect.</span>
                    </div>

                    <button type="submit">Me connecter</button>
                
                </form>

                <p class="link">
                    Pas encore de compte ? <a href="minscrire.html">M'inscrire</a>
                </p>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-left">
            <span class="header-logo-dice">🎲</span>
            <span class="header-logo-name">MJ Facility</span>
        </div>
    </footer>

</body>
</html>
