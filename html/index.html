<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Facility</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="des.css">
    <script src="rollDice.js" defer></script>
</head>

<body>

    <header class="header"> 
        <a href="index.html" class="header-logo">
            <span class="header-logo-dice">🎲</span>
            <div class="header-logo-text">
                <span class="header-logo-name">MJ Facility</span>
            </div>
        </a>

        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Lance tes dés</a></li>
                <li><a href="connexion.html" class="nav-link">Profil</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div id="container">

            <h2>Lance tes dés !</h2>

            <div class="page-gauche">

                <div class="dice-input">
                     <label for="d4">D4:</label>
                    <input type="number" id="d4" min="0" max="10" value="1">
                </div>

                <div class="dice-input">
                    <label for="d6">D6:</label>
                    <input type="number" id="d6" min="0" max="10" value="1">
                </div>

                <div class="dice-input">
                    <label for="d8">D8:</label>
                    <input type="number" id="d8" min="0" max="10" value="1">
                </div>

                <div class="dice-input">
                    <label for="d10">D10:</label>
                    <input type="number" id="d10" min="0" max="10" value="1">
                </div>

                <div class="dice-input">
                    <label for="d12">D12:</label>
                    <input type="number" id="d12" min="0" max="10" value="1">
                </div>

                <div class="dice-input">
                    <label for="d20">D20:</label>
                    <input type="number" id="d20" min="0" max="10" value="1">
                </div>

                <div class="dice-input">
                    <label for="d100">D100:</label>
                    <input type="number" id="d100" min="0" max="10" value="1">
                </div>

            </div>
            
            <div class="milieu-page">
                <div id="diceResult"></div>
                <div id="diceImages"></div>
                <div class="buttons">
                    <button type="button" class="btn-roll" onclick="rollDice()">🎲 Lancer</button>
                    <button type="button" class="btn-reset" onclick="resetDice()">Effacer</button>
                </div>
            </div>
        </div>

    </main>

    <footer class="footer">
        <div class="footer-left">
            <span class="footer-logo-dice">🎲</span>
            <span class="footer-logo-name">MJ Facility</span>
        </div>
    </footer>
</body>
</html>
