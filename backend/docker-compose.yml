version: '3.8'

services:

  node: 
    build: .
    container_name: mjfacility-node
    ports:
    - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/MJFacility
      - JWT_SECRET=redbull_mulberry_crunchy_crunshy_bush_1995
      - ADMIN_EMAIL=ga.hiaume@laposte.net
      - ADMIN_PASSWORD=Lampadaire77!
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo:6
    container_name: mjfacility-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mjfacility-mongo-express
    ports:
      - "8081-8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
    depends_on:
      - mongo

volumes:
  mongo-data: